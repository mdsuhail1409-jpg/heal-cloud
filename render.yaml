# Render Infrastructure as Code Blueprint for HealCloud
# https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Web API Service
  - type: web
    name: healcloud-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: healcloud-postgres
          property: connectionString
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: ALLOW_LOCAL_TARGETS
        value: "false"

  # 2. React Frontend Static Site
  - type: static
    name: healcloud-ui
    rootDir: frontend
    plan: free
    region: frankfurt
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: healcloud-api
          property: host

# Managed Databases
databases:
  - name: healcloud-postgres
    plan: free
    region: frankfurt
    databaseName: healcloud_db
    user: healcloud
    postgresMajorVersion: 16
